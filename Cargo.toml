[package]
name = "qubit-function"
version = "0.16.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-function"
description = "Functional programming traits and Box/Rc/Arc adapters for Rust, inspired by Java functional interfaces"
homepage = "https://github.com/qubit-ltd/rs-function"
documentation = "https://docs.rs/qubit-function"
readme = "README.md"
keywords = ["functional", "predicate", "function", "consumer", "supplier"]
categories = ["development-tools", "rust-patterns"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/examples/**",
    "/src/**",
    "/tests/**",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[lib]
name = "qubit_function"
doctest = true

[features]
default = []
rc = []
once = []
stateful = ["dep:parking_lot"]
full = ["rc", "once", "stateful"]

[dependencies]
parking_lot = { version = "0.12", optional = true }

[dev-dependencies]
qubit-local-files = { path = "../rs-local-files", version = "0.7" }

